[project]
name = "onboard-memory-mcp"
version = "4.2.0"
description = "On Board — Cross-platform shared memory MCP for multi-agent project coordination. One project, one memory, every platform."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
    "mcp[cli]>=2.3.0,<3",
    "pydantic>=2.0.0",
    "anyio>=4.14.2",
    "pyjwt[crypto]>=2.15.0",
    "cryptography>=50.0.0",
]

[project.scripts]
onboard-memory-mcp = "server:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = ".work/pytest-cache"

[tool.ruff]
cache-dir = ".work/ruff-cache"

[tool.hatch.build.targets.wheel]
only-include = [
    "server.py",
    "a2a_wait.py",
    "ticket_roles.py",
    "thrift_compress.py",
    "board_resources.py",
    "board_subscriptions.py",
    "dashboard_live.py",
    "onboard_server.py",
    "docs/assets/on-board-icon.png",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "pyproject.toml",
    "README.md",
    "LICENSE",
    "server.py",
    "a2a_wait.py",
    "ticket_roles.py",
    "thrift_compress.py",
    "board_resources.py",
    "board_subscriptions.py",
    "dashboard_live.py",
    "onboard_server.py",
    "docs/assets/on-board-icon.png",
]
