name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Set up Node
        # The dashboard tests execute the emitted inline JS under a real
        # runtime; without Node (or Bun) they skip, which is not acceptable in
        # CI. Node LTS is the primary runtime they look for.
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run tests
        # The offline suites live at the repo root, not under tests/, so a bare
        # `pytest tests` silently skipped all of them -- including the role gate
        # and the wait primitive, which are the two things v4 is actually about.
        # Enumerated rather than using `pytest .` because test_a2a_live.py and
        # test_a2a_multiprocess.py need a live board and do not belong in CI.
        run: >
          uv run python -m pytest tests
          test_board_lock.py
          test_a2a_wait_offline.py
          test_ticket_roles_offline.py
          test_snapshot_gate_offline.py
          test_idle_budget_offline.py
          test_thrift_compress.py
          test_hot_cold_split_offline.py
          test_handoff_pinning_offline.py
          test_board_lock.py
          -q

      - name: Compile Python files
        run: uv run python -m py_compile server.py dashboard_live.py

      - name: Validate JSON templates
        run: |
          for f in configs/*.json; do
            uv run python -m json.tool "$f" > /dev/null
          done

      - name: Validate shell scripts
        run: |
          bash -n setup-project.sh
          bash -n hooks/*.sh

      - name: Build distributions
        # Default `python -m build` builds the sdist from the tree and the wheel
        # FROM that sdist, so a wheel-only install is exercised against exactly
        # what would be published. --no-project keeps uv from syncing this
        # checkout into the throwaway build environment.
        run: uv run --no-project --with build python -m build --outdir dist

      - name: Verify built archives
        run: python tools/check_distribution.py dist

      - name: Install the wheel into a fresh venv and smoke-test it
        # Wheel-only install: no editable/source install, no MCP connection and
        # no real board. The helper clears PYTHONPATH and runs `python -I` from
        # outside the checkout so an import can only come from the wheel.
        run: |
          uv venv --python .venv/bin/python .work/package-smoke
          uv pip install --python .work/package-smoke/bin/python dist/*.whl
          python tools/smoke_installed.py "$PWD/.work/package-smoke/bin/python"
