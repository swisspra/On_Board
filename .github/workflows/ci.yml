name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.10"

      - name: Set up Node
        # The dashboard tests execute the emitted inline JS under a real
        # runtime; without Node (or Bun) they skip, which is not acceptable in
        # CI. Node LTS is the primary runtime they look for.
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install dependencies
        run: uv sync --locked --extra test

      - name: Audit runtime dependencies
        # Deterministic advisory gate over the locked runtime dependency set.
        # The export is derived from uv.lock (--locked, never rewriting it) and
        # pip-audit runs in a throwaway environment (--no-project) against that
        # file only, so the scanner's own dependencies are never in scope.
        # --require-hashes makes pip-audit check every pinned artifact against
        # its recorded hash and --strict fails the job on any collection
        # problem; no advisories are ignored.
        run: |
          mkdir -p .work/audit
          uv export --locked --no-dev --no-emit-project --format requirements-txt > .work/audit/requirements.txt
          uv run --no-project --with pip-audit==2.10.1 pip-audit --require-hashes --strict -r .work/audit/requirements.txt

      - name: Run tests
        # pyproject.toml collects all offline suites from tests/. Scratch-board
        # developer checks live in tools/live/ and are opt-in CLI programs.
        # Keep local and CI discovery identical and turn warnings into failures.
        run: uv run python -m pytest -W error -q

      - name: Compile Python files
        run: >
          uv run python -m py_compile server.py dashboard_live.py
          board_resources.py board_subscriptions.py skills/onboard/scripts/setup.py

      - name: Validate JSON templates
        run: |
          for f in configs/*.json; do
            uv run python -m json.tool "$f" > /dev/null
          done

      - name: Validate shell scripts
        run: |
          bash -n setup-project.sh
          bash -n hooks/*.sh

      - name: Build distributions
        # Default `python -m build` builds the sdist from the tree and the wheel
        # FROM that sdist, so a wheel-only install is exercised against exactly
        # what would be published. --no-project keeps uv from syncing this
        # checkout into the throwaway build environment.
        run: uv run --no-project --with build python -m build --outdir dist

      - name: Verify built archives
        run: python tools/check_distribution.py dist

      - name: Install the wheel into a fresh venv and smoke-test it
        # Wheel-only install: no editable/source install and no real board. The
        # helper clears PYTHONPATH and runs `python -I` from outside the checkout
        # so an import can only come from the wheel, then drives the installed
        # console over a synthetic local stdio project only (both protocol eras
        # plus a cross-process subscription event); no real board is touched.
        run: |
          uv venv --python .venv/bin/python .work/package-smoke
          uv pip install --python .work/package-smoke/bin/python dist/*.whl
          python tools/smoke_installed.py "$PWD/.work/package-smoke/bin/python"

  skill-helper:
    # The project-configuration helper is stdlib-only and platform-sensitive
    # (path separators, file modes, TOML rewriting), so it runs on every OS the
    # installer claims to support. Nothing is installed or imported from the
    # runtime here: no client, no venv sync, no MCP server, no real project.
    name: Skill helper (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install the test runner
        run: python -m pip install "pytest>=8.0.0"

      - name: Run the project-configuration helper tests
        run: python -m pytest -W error tests/test_skill_setup.py -q
