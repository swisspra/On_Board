name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build release distributions
        # Default `python -m build` builds the sdist from the tree and the wheel
        # FROM that sdist, so the published wheel is built from the published
        # source archive rather than straight from the checkout.
        run: |
          python -m pip install build
          python -m build --outdir dist

      - name: Verify built archives
        run: python tools/check_distribution.py dist

      - name: Install the wheel into a fresh venv and smoke-test it
        # Gate the upload on a wheel-only install: no editable/source install,
        # no MCP connection and no real board. The helper clears PYTHONPATH and
        # runs `python -I` from outside the checkout so an import can only come
        # from the wheel.
        run: |
          python -m venv .work/package-smoke
          .work/package-smoke/bin/pip install dist/*.whl
          python tools/smoke_installed.py "$PWD/.work/package-smoke/bin/python"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      id-token: write

    environment:
      name: pypi

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
